<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancyblooms</title>
    <link rel="stylesheet" href="/styles/style.css" type="text/css" media="all">

  <body>
    <h1>Welcome to my Website!</h1>
    <br>
    <div id="wip">
    <hr>    
      <p>We're under construction!</p>

    <div id="website">
      <div id="mainGrid">
        <div class="artDiv" onclick="artPage()">
          <div class="artWindow">
            <div id="artCircle" class="redButton"></div>
            <div id="artCircle" class="greenButton"></div>
            <div id="artCircle" class="yellowButton"></div>
            <div class="artTools">
              <div id=tool class="t1"></div>
              <div id=tool class="t2"></div>
              <div id=tool class="t3"></div>
              <div id=tool class="t4"></div>
              <div id=tool class="t5"></div>
              <div id=tool class="t6"></div>
            </div>
            <div class="artSquare">
              <p id="gridPage" class="artBtn">Art</p>  <!-- canvas(?)/window -->
            </div>
            <div class="artColors">
              <div id="colorSquare" class="redSqr"></div>
              <div id="colorSquare" class="orangeSqr"></div>
              <div id="colorSquare" class="yellowSqr"></div>
              <div id="colorSquare" class="greenSqr"></div>
              <div id="colorSquare" class="blueSqr"></div>
              <div id="colorSquare" class="purpleSqr"></div>
              <div id="colorSquare" class="whiteSqr"></div>
            </div>
          </div>
        </div>
        <div>
          <div class="storiesDiv" onclick="storiesPage()">
            <div class="outsideBook" >
              <p id="gridPage" class="storiesBtn">Stories</p> <!-- notebook/book -->
            </div>
            <div class="insideBook">
              <p style="font-family: Redacted Script; font-size: 17px;">this is where I write stuff. bla bla bla. bla bla bla. bla bla bla. bla bla.  are you reading this? that's pretty cool bud. I welcome you to my random musings. I hope you're blessed and happy.</p>
            </div>
            <div class="bookmark"></div>
            <!-- <div class="bookBox"></div> -->
          </div>
          <!-- <div class="storiesDiv" onclick="storiesPage()">
            <p style="font-family: Redacted Script; padding: 16px; font-size: 14px; opacity: 0.3">this is where I write stuff</p>
            <p id="gridPage" class="storiesBtn">Stories</p> <!-- notebook/book -->
            <!-- <p style="font-family: Redacted Script; padding: 16px; font-size: 14px; opacity: 0.3">are you actually reading this? pretty cool bud. welcome</p>
          </div> -->
        </div>
        <div class="programmingDiv" onclick="programmingPage()">
          <div id="gridPage" class="programmingBtn" >
            <p style="margin-left: -5px; transform:skew(-5deg)">Programming</p> <!-- game/computer -->
          </div>        
          <p class="computerNeck"></p>
          <p class="keyboardPart"></p>
        </div>
        <div class="meDiv" onclick="mePage()">
          <!-- <div id="earsDiv">
          </div> -->
            <div id="meEar" class="left"></div>
            <div id="meEar" class="right"></div>
          <div id="gridPage" class="meBtn">

          </div>           
          <div id="meEye" class="left"></div>
          <div id="meEye" class="right"></div>
          <div id="meNose"></div>
        </div>
